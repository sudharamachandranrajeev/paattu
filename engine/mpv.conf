# Paattu engine: headless mpv that plays YouTube audio through yt-dlp.
# Installed to ~/.config/paattu/mpv/mpv.conf; run by paattu-engine.service.

# A custom config dir skips /etc/mpv/scripts, so load MPRIS (media keys,
# Omarchy OSD) explicitly.
scripts-append=/usr/lib/mpv-mpris/mpris.so

idle=yes
video=no
audio-display=no
terminal=no
force-window=no
input-default-bindings=no
osc=no

# Opus first: it's what YouTube serves best for music.
ytdl-format=bestaudio[acodec=opus]/bestaudio/best
cache=yes
demuxer-max-bytes=64MiB
demuxer-readahead-secs=90
prefetch-playlist=yes
gapless-audio=weak

volume=80
volume-max=100
save-position-on-quit=no
keep-open=no
msg-level=all=warn
