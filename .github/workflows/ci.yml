name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_only:
        description: Only the Flutter app job (a quicker check while the app changes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop Paattu (Python, shell plugin, installer lint)
    if: ${{ !inputs.app_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Shell plugin model tests
        run: node --test tests/*.test.mjs
      - name: shellcheck
        run: shellcheck install.sh

  install:
    name: install.sh on ${{ matrix.image }}
    if: ${{ !inputs.app_only }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]
    steps:
      - name: Prepare a user with sudo
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo curl ca-certificates >/dev/null
          elif command -v dnf >/dev/null; then
            dnf install -y -q sudo curl shadow-utils util-linux
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed sudo curl >/dev/null
          elif command -v zypper >/dev/null; then
            zypper -n -q install sudo curl shadow util-linux
          fi
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          chmod 440 /etc/sudoers.d/tester
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install as a normal user
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/tester/paattu
          chown -R tester: /home/tester/paattu
          su - tester -c 'cd ~/paattu && ./install.sh --yes'
      - name: Check the install
        run: |
          su - tester -c '
            set -e
            cd ~/paattu
            ./install.sh --check
            export PATH="$HOME/.local/bin:$PATH"
            paattu --version
            mpv --version | head -1
            (command -v yt-dlp >/dev/null && yt-dlp --version) || ~/.local/bin/yt-dlp --version
            test -f ~/.config/paattu/mpv/mpv.conf
            test -f ~/.config/paattu/mpv/scripts/paattu.lua
            ! grep -q @PAATTU@ ~/.config/paattu/mpv/scripts/paattu.lua
            ./install.sh --uninstall
            test ! -e ~/.local/bin/paattu
          '

  app:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # pubspec.lock is resolved here (no Flutter on the dev machine): show
      # what changed, to copy back into the repo.
      - name: Lockfile changes
        run: git diff --exit-code -- pubspec.lock || echo "::warning::pubspec.lock is out of date (diff above)"
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
